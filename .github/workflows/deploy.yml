name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `prebuild` copies OpenCV.js and the pdf.js wasm/cmaps into public/vendor/.
      - run: npm run build
      - name: Check that runtime assets are served under the base path
        run: |
          test -s dist/vendor/opencv.js
          test -s dist/vendor/opencv_js.wasm
          test -s dist/vendor/pdfjs/wasm/jbig2.wasm
          test -s dist/vendor/pdfjs/wasm/openjpeg.wasm
          grep -q '/music_sheet_tools/assets/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
